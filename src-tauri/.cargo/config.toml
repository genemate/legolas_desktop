# Cargo configuration for LE.GO.LAS Desktop (steptwo_desktop)
#
# Permanently wires MSVC Build Tools 2022 (v17.14) + Windows SDK 10.0.26100.0.
# After this file is in place, plain `cargo check` / `cargo build` works from
# any PowerShell — no need to run vcvars64.bat manually.

[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"

rustflags = [
  # MSVC runtime libs (msvcrt.lib, vcruntime.lib, …)
  "-L", "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64",
  # Windows SDK: kernel32.lib, user32.lib, ws2_32.lib, dbghelp.lib, …
  "-L", "C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64",
  # Universal CRT: ucrt.lib, …
  "-L", "C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64",
]

# ── Environment variables injected for every cargo invocation ─────────────
[env]
# LIB — used by build.rs scripts (cc, embed-resource, etc.)
LIB = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\um\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.26100.0\\ucrt\\x64"

# INCLUDE — used by cc / bindgen / build scripts that compile C/C++ code
INCLUDE = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\include;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\ucrt;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\um;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\shared"
