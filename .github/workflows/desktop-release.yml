name: "Release Desktop App (Windows, macOS, Linux)"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            arch_name: "arm64"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            arch_name: "x64"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LE.GO.LAS Desktop ${{ github.ref_name }}"
          releaseBody: "Корпоративное приложение LE.GO.LAS для Windows (.exe, .msi), macOS (.dmg, .zip с автоустановщиком) и Linux (.AppImage, .deb)."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Package One-Click macOS Installer Zip
        if: startsWith(matrix.platform, 'macos')
        run: |
          chmod +x scripts/install_mac.command
          mkdir -p mac_installer
          cp scripts/install_mac.command "mac_installer/Install_LE.GO.LAS.command"
          cp scripts/ИНСТРУКЦИЯ_ПО_УСТАНОВКЕ.txt "mac_installer/ИНСТРУКЦИЯ_ПО_УСТАНОВКЕ.txt"
          cp -R "src-tauri/target/${{ matrix.target }}/release/bundle/macos/LE.GO.LAS.app" mac_installer/
          cd mac_installer
          zip -r "../LE.GO.LAS_macOS_${{ matrix.arch_name }}_OneClick_Installer.zip" .
          cd ..

      - name: Upload One-Click macOS Zip to Release
        if: startsWith(matrix.platform, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "LE.GO.LAS_macOS_${{ matrix.arch_name }}_OneClick_Installer.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
